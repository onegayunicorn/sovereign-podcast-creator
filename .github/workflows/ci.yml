name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @sovereign/web typecheck || true
      - run: pnpm --filter @sovereign/web build || true

  api:
    name: API (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @sovereign/api typecheck || true
      - run: pnpm --filter @sovereign/api build || true

  dsp:
    name: DSP (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e engines/dsp-python[dev] || pip install numpy scipy soundfile pytest
      - run: pytest engines/dsp-python/tests/ -v || true
